<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<title>Chargement…</title>
<meta name="description" content="">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+Display:ital,wght@0,400;0,500;0,600;0,700;1,400&family=Lato:ital,wght@0,300;0,400;0,700;0,900;1,400&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" defer></script>
<link rel="stylesheet" href="styles.css?v=28">
</head>
<body>

<div class="progress" id="progress"></div>

<!-- ══ NAVIGATION ══ -->
<header class="nav" id="nav">
  <div class="wrap nav__in">
    <a href="#" class="nav__logo">
      <span class="nav__mark" aria-hidden="true"></span>
      <span id="nav-nom"></span>
    </a>
    <nav class="nav__links" id="nav-links"></nav>
    <a class="nav__tel" id="nav-tel"></a>
    <button class="nav__burger" id="burger" aria-label="Menu"><span></span><span></span><span></span></button>
  </div>
</header>

<!-- ══ HERO ══ -->
<section class="hero" id="hero">
  <div class="hero__media" id="hero-media">
    <picture>
      <source id="hero-src-m" media="(max-width:768px)">
      <img id="hero-img" alt="" fetchpriority="high">
    </picture>
    <picture class="hero__before" id="hero-before" hidden>
      <source id="hero-bsrc-m" media="(max-width:768px)">
      <img id="hero-bimg" alt="" fetchpriority="high">
    </picture>
    <span class="hero__line" id="hero-line" hidden></span>
  </div>
  <div class="hero__veil"></div>
  <div class="wrap hero__in">
    <p class="hero__sur" data-c="hero.surtitre" hidden></p>
    <h1 class="hero__h1" data-c="hero.titre"></h1>
    <p class="hero__sub" data-c="hero.sous_titre"></p>
  </div>
</section>

<!-- ══ BARRE D'ACTION (sous la photo) ══ -->
<div class="ctabar">
  <div class="wrap ctabar__in">
    <a href="#contact" class="btn btn--gold btn--sm" data-c="hero.bouton"></a>
    <a class="ctabar__tel" id="ctabar-tel"></a>
  </div>
  <nav class="wrap ctabar__mots" id="ctabar-mots" aria-label="Nos interventions"></nav>
</div>

<!-- ══ AVANT / APRÈS ══ -->
<section class="sec sec--paper" id="avantapres">
  <div class="wrap">
    <div class="head head--center reveal">
      <h2 class="head__h2" data-c="avantapres.titre"></h2>
      <p class="head__lede" data-c="avantapres.sous_titre"></p>
    </div>
  </div>
  <div class="wrap ba-list" id="ba-list"></div>
</section>

<!-- ══ PRESTATIONS ══ -->
<section class="sec sec--paper" id="prestations">
  <div class="wrap">
    <div class="head head--center reveal">
      <h2 class="head__h2" data-c="prestations_titre"></h2>
      <p class="head__lede" data-c="prestations_intro"></p>
    </div>
  </div>
  <div class="tiles" id="tiles"></div>
</section>

<!-- ══ QUIZ ══ -->
<section class="sec sec--grey" id="quiz">
  <div class="wrap">
    <div class="head head--center reveal">
      <h2 class="head__h2" data-c="quiz.titre"></h2>
      <p class="head__lede" data-c="quiz.sous_titre"></p>
    </div>
    <div class="qz reveal" id="qz">
      <div class="qz__bar"><span class="qz__fill" id="qz-fill"></span></div>
      <div class="qz__body" id="qz-body"></div>
    </div>
  </div>
</section>

<!-- ══ AVIS ══ -->
<section class="sec sec--ink" id="avis" hidden>
  <div class="wrap">
    <div class="head head--center reveal">
      <h2 class="head__h2" data-c="avis_titre"></h2>
      <p class="head__kick" data-c="avis_surtitre"></p>
    </div>
    <div class="temo" id="avis-grid"></div>
  </div>
</section>

<!-- ══ ZONE + QUESTIONNAIRE WHATSAPP ══ -->
<section class="sec sec--paper" id="zone">
  <div class="wrap">
    <div class="head head--center reveal">
      <h2 class="head__h2" data-c="zone.titre"></h2>
      <p class="head__lede" data-c="zone.texte"></p>
    </div>
    <div class="geo">
      <div class="geo__left reveal">
        <div class="geo__map" id="map"></div>
        <ul class="geo__pays" id="geo-pays"></ul>
      </div>
      <div class="geo__right reveal">
        <h3 class="geo__t" data-c="geo.titre"></h3>
        <p class="geo__s" data-c="geo.sous_titre"></p>
        <div class="gq" id="gq">
          <div class="gq__bar"><span class="gq__fill" id="gq-fill"></span></div>
          <div class="gq__body" id="gq-body"></div>
        </div>
      </div>
    </div>
  </div>
</section>

<!-- ══ CONTACT ══ -->
<section class="sec sec--ink" id="contact">
  <div class="wrap">
    <div class="ct reveal">
      <div class="ct__left">
        <p class="ct__kick" data-c="contact.surtitre"></p>
        <h2 class="ct__h2" data-c="contact.titre"></h2>
        <p class="ct__p" data-c="contact.texte"></p>
        <a class="ct__tel" id="contact-tel">
          <span class="ct__telico" aria-hidden="true">
            <svg viewBox="0 0 24 24"><path d="M6.6 10.8a15.1 15.1 0 0 0 6.6 6.6l2.2-2.2a1 1 0 0 1 1-.25 11.4 11.4 0 0 0 3.6.57 1 1 0 0 1 1 1V20a1 1 0 0 1-1 1A17 17 0 0 1 3 4a1 1 0 0 1 1-1h3.5a1 1 0 0 1 1 1c0 1.25.2 2.46.57 3.6a1 1 0 0 1-.25 1z"/></svg>
          </span>
          <span class="ct__telnum" id="contact-telnum"></span>
        </a>
        <dl class="ct__meta">
          <div><dt>Horaires</dt><dd data-c="contact.horaires"></dd></div>
          <div><dt>Email</dt><dd id="contact-mail"></dd></div>
          <div><dt>Secteur</dt><dd id="contact-zone"></dd></div>
        </dl>
      </div>
      <form class="ct__form" id="contact-form" hidden>
        <p class="ct__formt">Ou laissez-nous un message</p>
        <label>Votre nom<input type="text" name="nom" required></label>
        <label>Téléphone<input type="tel" name="telephone" required></label>
        <label>Votre projet<textarea name="message" rows="4" required></textarea></label>
        <button type="submit" class="btn btn--gold">Envoyer ma demande</button>
        <p class="ct__rgpd">Vos coordonnées servent uniquement à vous recontacter. Aucune revente, aucune newsletter.</p>
      </form>
    </div>
  </div>
</section>

<!-- ══ PIED DE PAGE ══ -->
<footer class="foot">
  <div class="wrap foot__row" id="foot-row"></div>
  <div class="wrap foot__legal">
    <span id="foot-copy"></span>
    <a href="mentions.html">Mentions légales</a>
  </div>
</footer>

<a class="callbar" id="callbar">
  <span class="callbar__ico" aria-hidden="true">
    <svg viewBox="0 0 24 24"><path d="M6.6 10.8a15.1 15.1 0 0 0 6.6 6.6l2.2-2.2a1 1 0 0 1 1-.25 11.4 11.4 0 0 0 3.6.57 1 1 0 0 1 1 1V20a1 1 0 0 1-1 1A17 17 0 0 1 3 4a1 1 0 0 1 1-1h3.5a1 1 0 0 1 1 1c0 1.25.2 2.46.57 3.6a1 1 0 0 1-.25 1z"/></svg>
  </span>
  <span class="callbar__txt">
    <span class="callbar__l">Une question sur votre projet ?</span>
    <span class="callbar__n" id="callbar-num"></span>
  </span>
</a>

<noscript><div style="padding:2rem;font-family:sans-serif">Ce site a besoin de JavaScript pour afficher son contenu.</div></noscript>

<script src="contenu.js?v=28"></script>
<script src="script.js?v=28"></script>
</body>
</html>
