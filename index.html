<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<title>Chargement…</title>
<meta name="description" content="">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css?v=6">
</head>
<body>

<div class="progress" id="progress"></div>

<!-- ══ NAVIGATION ══ -->
<header class="nav" id="nav">
  <div class="wrap nav__in">
    <a href="#" class="nav__logo">
      <span class="nav__mark" aria-hidden="true"></span>
      <span id="nav-nom"></span>
    </a>
    <nav class="nav__links" id="nav-links"></nav>
    <a class="nav__tel" id="nav-tel"></a>
    <button class="nav__burger" id="burger" aria-label="Menu"><span></span><span></span><span></span></button>
  </div>
</header>

<!-- ══ HERO ══ -->
<section class="hero" id="hero">
  <div class="hero__media">
    <picture>
      <source id="hero-src-m" media="(max-width:768px)">
      <img id="hero-img" alt="" fetchpriority="high">
    </picture>
  </div>
  <div class="hero__veil"></div>
  <div class="wrap hero__in">
    <p class="hero__sur" data-c="hero.surtitre"></p>
    <h1 class="hero__h1" data-c="hero.titre"></h1>
    <p class="hero__sub" data-c="hero.sous_titre"></p>
    <div class="hero__cta">
      <a href="#contact" class="btn btn--gold" data-c="hero.bouton"></a>
      <a href="#avantapres" class="btn btn--ghost" data-c="hero.bouton2"></a>
    </div>
  </div>
  <div class="wrap hero__pillars"><div class="pillars" id="pillars"></div></div>
  <div class="hero__scroll" aria-hidden="true"><span></span></div>
</section>

<!-- ══ AVANT / APRÈS ══ -->
<section class="sec sec--paper" id="avantapres">
  <div class="wrap">
    <div class="head head--center reveal">
      <h2 class="head__h2" data-c="avantapres.titre"></h2>
      <p class="head__lede" data-c="avantapres.sous_titre"></p>
    </div>
  </div>
  <div class="wrap ba-list" id="ba-list"></div>
</section>

<!-- ══ PRESTATIONS ══ -->
<section class="sec sec--paper" id="prestations">
  <div class="wrap">
    <div class="head head--center reveal">
      <h2 class="head__h2" data-c="prestations_titre"></h2>
      <p class="head__lede" data-c="prestations_intro"></p>
    </div>
  </div>
  <div class="tiles" id="tiles"></div>
</section>

<!-- ══ QUIZ ══ -->
<section class="sec sec--grey" id="quiz">
  <div class="wrap">
    <div class="head head--center reveal">
      <h2 class="head__h2" data-c="quiz.titre"></h2>
      <p class="head__lede" data-c="quiz.sous_titre"></p>
    </div>
    <div class="qz reveal" id="qz">
      <div class="qz__bar"><span class="qz__fill" id="qz-fill"></span></div>
      <div class="qz__body" id="qz-body"></div>
    </div>
  </div>
</section>

<!-- ══ AVIS ══ -->
<section class="sec sec--ink" id="avis" hidden>
  <div class="wrap">
    <div class="head head--center reveal">
      <h2 class="head__h2" data-c="avis_titre"></h2>
      <p class="head__kick" data-c="avis_surtitre"></p>
    </div>
    <div class="temo" id="avis-grid"></div>
  </div>
</section>

<!-- ══ ZONE ══ -->
<section class="sec sec--paper" id="zone">
  <div class="wrap">
    <div class="head reveal">
      <h2 class="head__h2" data-c="zone.titre"></h2>
      <p class="head__kick">ZONE D'INTERVENTION</p>
      <p class="head__lede" data-c="zone.rayon"></p>
    </div>
    <ul class="zone" id="zone-list"></ul>
  </div>
</section>

<!-- ══ CONTACT ══ -->
<section class="sec sec--gold" id="contact">
  <div class="wrap contact">
    <div class="contact__left reveal">
      <h2 class="contact__h2" data-c="contact.titre"></h2>
      <p class="contact__p" data-c="contact.texte"></p>
      <a class="contact__tel" id="contact-tel"></a>
      <p class="contact__meta" data-c="contact.horaires"></p>
      <p class="contact__meta" id="contact-mail"></p>
    </div>
    <form class="contact__form reveal" id="contact-form" hidden>
      <label>Votre nom<input type="text" name="nom" required></label>
      <label>Téléphone<input type="tel" name="telephone" required></label>
      <label>Votre projet<textarea name="message" rows="4" required></textarea></label>
      <button type="submit" class="btn btn--dark">Envoyer ma demande</button>
      <p class="contact__rgpd">Vos coordonnées servent uniquement à vous recontacter. Aucune revente, aucune newsletter.</p>
    </form>
  </div>
</section>

<!-- ══ PIED DE PAGE ══ -->
<footer class="foot">
  <div class="wrap foot__row" id="foot-row"></div>
  <div class="wrap foot__legal">
    <span id="foot-copy"></span>
    <a href="mentions.html">Mentions légales</a>
  </div>
</footer>

<a class="callbar" id="callbar"></a>

<noscript><div style="padding:2rem;font-family:sans-serif">Ce site a besoin de JavaScript pour afficher son contenu.</div></noscript>

<script src="contenu.js?v=6"></script>
<script src="script.js?v=6"></script>
</body>
</html>
